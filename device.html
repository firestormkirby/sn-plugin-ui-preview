<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Plugin panel</title>
    <style>
      /* The page IS the device screen: the panel measures itself against
         window dimensions, so this document must be exactly device-sized and
         must never grow its own scrollbars. The harness sizes the iframe. */
      html, body, #root { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden; }
      body { background: #ffffff; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Metro's asset require(). The bundled Whimsy pack declares its PNGs with
      require('../../assets/...') at module scope, which is a compile-time
      construct in a React Native bundle and simply absent in a browser. It has
      to exist before the module graph is evaluated, hence a classic script tag
      here rather than anything inside device.tsx, whose imports hoist above
      every statement in it.
    -->
    <script>
      window.require = function (p) { return { uri: String(p), __rnAsset: true }; };
    </script>
    <script type="module" src="/src/device.tsx"></script>
  </body>
</html>
